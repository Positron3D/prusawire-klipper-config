[include common_mainboard.cfg]

# Homing Macro Variables
[gcode_macro _HOME_X]
variable_driver_type: 'tmc2209'
variable_home_current_divisor: 2

[gcode_macro _HOME_Y]
variable_driver_type: 'tmc2209'
variable_home_current_divisor: 2

[stepper_x]
endstop_pin: tmc2209_stepper_x:virtual_endstop

[tmc2209 stepper_x]
# 0.348 A is Prusa's stock Y-axis current for the 1.0 A MK3 motors. driver_SGTHRS on
# every axis was tuned at this current; re-tune it if you change run_current.
run_current: 0.3480291
driver_SGTHRS: 135

[stepper_y]
endstop_pin: tmc2209_stepper_y:virtual_endstop

[tmc2209 stepper_y]
run_current: 0.3480291
driver_SGTHRS: 135

[tmc2209 stepper_z]
run_current: 0.3480291
driver_SGTHRS: 135

# Homing Macro Variables
[gcode_macro _HOME_X]
variable_driver_type: 'tmc2209'
variable_home_current_divisor: 1.5

[gcode_macro _HOME_Y]
variable_driver_type: 'tmc2209'
variable_home_current_divisor: 1.5