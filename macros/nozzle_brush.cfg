# Intended for A1-compatible nozzle wipers.
# Wipe pattern from: https://wiper-pathgen.6d6178.com/

[gcode_macro WIPE_NOZZLE]
variable_WIPE_TEMPERATURE: 170
# The start coordinates is the top-leftmost gap of the A1-compatible nozzle wiper.
variable_START_X: 0
variable_START_Y: -24
variable_START_Z: 1
variable_RAISE_Z: 5
gcode:
    {% set wipe_temperature = params.WIPE_TEMPERATURE|default(170)|int %}
    {% set start_x = params.START_X|default(0)|float %}
    {% set start_y = params.START_Y|default(-24)|float %}
    {% set start_z = params.START_Z|default(1)|float %}
    {% set raize_z = params.RAISE_Z|default(5)|float %}
  
    # Home the printer and move the toolhead over the wiper.
    CHOME
	G90
	G1 X{start_x} Y{start_y} Z{start_z + raize_z}
	G91
	G1 X20.670 Y-2.655
  
    # Raise the nozzle temperature.
    {% set initial_nozzle_temperature = printer.extruder.target %}
    {% if initial_nozzle_temperature < wipe_temperature %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={wipe_temperature}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={wipe_temperature}
    {% endif %}
  
    # Wipe the nozzle.
    G0 Z-{raize_z} F10000
    G0 X0.000 Y2.160 F10000
    G0 X-4.995 Y0.000 F10000
    G0 X0.000 Y-2.160 F10000
    G0 X-4.995 Y0.000 F10000
    G0 X0.000 Y2.160 F10000
    G0 X9.990 Y-2.160 F10000
    G0 X-9.990 Y0.000 F10000
    G0 X0.000 Y1.080 F10000
    G0 X9.990 Y0.000 F10000
    G0 X0.000 Y1.080 F10000
    G0 X-9.990 Y0.000 F10000
    G0 X-12.580 Y-5.000 F10000
    G0 X35.150 Y0.000 F10000
    G0 X0.000 Y7.840 F10000
    G0 X-35.150 Y0.000 F10000
    G0 X36.075 Y-1.520 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X35.150 Y0.000 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000
    G0 X-1.850 Y-4.800 F10000
    G0 X-1.850 Y4.800 F10000

	# Raise the nozzle back up.
    G1 Z{raize_z}
  
    # Lower the nozzle temperature back down.
    # The part cooling fan is used to try to speed up cooling.
    {% if initial_nozzle_temperature < wipe_temperature %}
      	SET_HEATER_TEMPERATURE HEATER=extruder TARGET={initial_nozzle_temperature}
    	{% if initial_nozzle_temperature > 0 %}
            M106 S255
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={initial_nozzle_temperature}
            M106 S0
    	{% endif %}
    {% endif %}
