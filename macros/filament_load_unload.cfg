[gcode_macro M600]
description: Color change or runout. PAUSE parks the toolhead, then the filament is pulled clear of the hotend while it is still hot.
gcode:
    PAUSE
    M83                         ; set extruder to relative mode
    G1 E-50 F1000               ; pull filament clear of the hotend
    M117 Remove the old filament, insert new filament, then RESUME

[gcode_macro _FILAMENT_RETRACT]
description: Pulls the filament tip above the melt zone so it can be unloaded later without a full heat
variable_retract_distance: 15
gcode:
    M83                         ; set extruder to relative mode
    G1 E-2 F600                 ; slow start lets pressure drop without stringing
    G1 E-{retract_distance - 2} F1800
    M400                        ; wait for moves to finish

[gcode_macro UNLOAD_FILAMENT]
description: Warms the hotend to the pull temperature if needed, moves to the front and pulls the filament out
variable_pull_temp: 90
gcode:
    {% set needs_heat = printer.extruder.temperature < pull_temp %}
    {% set z_lift = [20, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min %}
    CHOME
    G91                         ; relative positioning
    G1 Z{z_lift}                ; move nozzle upwards, clamped to the top of travel
    FRONT                       ; move the toolhead to the front
    {% if needs_heat %}
    M109 S{pull_temp}           ; warm enough for the tip to release, too cool to ooze
    {% endif %}
    M83                         ; set extruder to relative mode
    G1 E-8 F1800                ; quickly retract a small amount to eliminate stringing
    G4 P200                     ; pause for a short amount of time
    G1 E-50 F300                ; retract slowly the rest of the way
    G1 E-20 F300
    M400                        ; wait for moves to finish
    {% if needs_heat %}
    M104 S0                     ; heater was off before, leave it off
    {% endif %}
    M117 Unload Complete!

[gcode_macro LOAD_FILAMENT]
description: Heats the hotend, moves to the front and loads filament
gcode:
    {% set current_target = printer.extruder.target|int %}
    {% set EXTRUDER_TEMP = params.TEMP|default(current_target if current_target > 0 else 230)|int %}
    FRONT                       ; move the toolhead to the front
    M109 S{EXTRUDER_TEMP}       ; heat up the hotend
    M83                         ; set extruder to relative mode
    G1 E50 F300                 ; extrude slowly
    G1 E50 F300
    M400                        ; wait for moves to finish
    {% if not printer.pause_resume.is_paused %}
    _FILAMENT_RETRACT           ; park the tip above the melt zone until the next print
    {% endif %}
    M117 Load Complete!
