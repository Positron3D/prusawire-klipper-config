[extruder]
min_temp: 0
max_temp: 310
sensor_type: ATC Semitec 104NT-4-R025H42G
# 0 lets the extruder pull filament without heating. The tip is parked above the
# melt zone by _FILAMENT_RETRACT after every load and print, and UNLOAD_FILAMENT
# warms the hotend before pulling. Set 170 for Klipper's usual cold extrusion check.
min_extrude_temp: 0
max_extrude_cross_section: 2