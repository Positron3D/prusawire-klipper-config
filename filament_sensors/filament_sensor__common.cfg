# Shared runout sensor behavior. Board files include this and set switch_pin.
[filament_switch_sensor filament_sensor]
# M600 pauses once and pulls the tail clear while the hotend is hot, so
# Klipper's own pause stays off.
pause_on_runout: False
event_delay: 3.0
runout_gcode:
    M118 Filament runout detected
    M600
insert_gcode:
    M118 Filament inserted
    LOAD_FILAMENT

# PRINT_START arms the sensor and PRINT_END disarms it, so it stays off while idle.
[delayed_gcode _DISABLE_FILAMENT_SENSOR]
initial_duration: 1
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0

# Lets mainsail.cfg refuse RESUME while no filament is detected. The macro itself
# is defined in macros/print_start_end.cfg; Klipper merges this variable into it.
[gcode_macro _CLIENT_VARIABLE]
variable_runout_sensor: "filament_switch_sensor filament_sensor"
