[output_pin _probe_ready]
shutdown_value: 0
value: 0

[probe]
x_offset: 0.0
y_offset: 0.0
samples: 3
samples_result: average
samples_tolerance: 0.05
samples_tolerance_retries: 3
sample_retract_dist: 2
speed: 8
activate_gcode:
    G4 P500
    SET_PIN PIN=_probe_ready VALUE=1
deactivate_gcode:
    SET_PIN PIN=_probe_ready VALUE=0  

[bed_mesh]
speed: 300
horizontal_move_z: 3
mesh_min: 40, 20
mesh_max: 210, 190
probe_count: 7, 7
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
mesh_pps: 3, 3
zero_reference_position: 125, 105

[stepper_z]
homing_speed: 10