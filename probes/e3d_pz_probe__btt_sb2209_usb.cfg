[include e3d_pz_probe__common.cfg]

[probe]
# Pin 5 of the PROBE header. It is buffered and 5V tolerant; pin 3 (gpio22) is the
# BLTouch servo output wired straight to the RP2040, which the PZ Probe's 5V idle level
# would stress. The buffer already has a pullup, so none is set here.
pin: !sb2209:gpio21
